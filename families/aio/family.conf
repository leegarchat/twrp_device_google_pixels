# families/aio/family.conf — shell-readable facts for the all-in-one build.
# AIO ships a single universal recovery cpio for every Tensor family; the
# installer swaps family files (fstab, twrp.flags, USB controller, keymint
# manifests) post-unpack on the target device (see aio/aio_swap.sh).
# UFS_ADDR/USBCTRL stay empty on purpose: nothing is baked, everything is
# selected at install/boot time. The build-time recovery.fstab + twrp.flags
# below are zuma placeholders so the image still builds and boots as-is on
# zuma/zumapro/gs201 (11210000.dwc3) without any swap.
FAMILY=aio
# UFS_ADDR intentionally unset (per-family, resolved by installer)
# USBCTRL intentionally unset (per-family, resolved by installer)
# EARLYCON_ADDR intentionally unset (no kernel is built for aio)
