# families/gs101/family.conf — shell-readable SoC facts (build scripts).
# Tensor G1: UFS 14700000 (same as gs201, reuses gs201 fstab), DWC3 USB
# 11110000 (verified from stock DT usb@11110000 + LOS init.recovery rc).
# No vendor_kernel_boot partition: kernel modules ship inside our platform
# ramdisk (families/gs101/modules/), flashed via vendor_boot:default.
FAMILY=gs101
UFS_ADDR=14700000
EARLYCON_ADDR=10A00000
USBCTRL=11110000.dwc3
FSTAB_FROM=stock (own fstab, LOS 6.1.145 reference)
ALT_EXTRA=oriole,raven,bluejay
