# fox_kdf.conf — V4 KDF playground for fox_fbe_kdf.
# Each line: one pipeline, first success wins. Override on device via
# /tmp/fox_kdf.conf (adb push, no rebuilds). CTX = the classic SP800 context.
sp800 fbe-key android-synthetic-password-personalization-context sha256 256
ph512
hex
slice 0 32 | sp800 fbe-key android-synthetic-password-personalization-context sha256 256
slice 0 32 | ph512
slice 0 32 | hex
slice 32 64 | hex
slice 0 64 | ph256
slice 0 32 | ph256
xorhalf | hex
xorhalf | sp800 fbe-key android-synthetic-password-personalization-context sha256 256
xorhalf | ph512
sp800 fbe-key android-synthetic-password-personalization-context sha512 256
