[package]
name = "hs-install"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-speed OTA installer engine for OrangeFox recovery (Pixel). Direct-fd style parallel payload writer with group rebuild, batch barriers and rollback. Static musl aarch64 prebuilt."

[[bin]]
name = "fox-hsinstall"
path = "src/main.rs"

[dependencies]
payload-hs = { path = "../payload-hs" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
